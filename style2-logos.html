<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Selection Show Wall</title>
<style>
html,body{margin:0;background:#05040A;color:#F3EEE0;font-family:Helvetica,Arial,sans-serif}
.wrap{width:1920px;height:1080px;margin:0 auto;background:radial-gradient(80% 70% at 50% 0%,#1B1630,#05040A);position:relative;box-sizing:border-box;padding:16px 24px 20px}
h1{margin:0;text-align:center;font-family:"Times New Roman",serif;letter-spacing:.28em;color:#E8C872;font-size:32px;font-weight:700}
.sub{text-align:center;color:#A89868;letter-spacing:.22em;font-size:12px;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.card{display:flex;align-items:center;gap:14px;background:#0C0B14;border:1px solid #2C2940;border-radius:10px;padding:8px 12px;height:82px;box-sizing:border-box}
.logo{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:8px;flex:0 0 64px}
.rank{width:54px;text-align:center;font-family:"Times New Roman",serif;font-size:28px;flex:0 0 54px}
.meta{flex:1;min-width:0}
.name{font-family:Arial Black,Helvetica,sans-serif;font-size:22px;letter-spacing:.04em}
.line{color:#9A937C;font-size:13px;margin-top:2px}
.chip{border-radius:18px;padding:6px 12px;font-weight:700;font-size:14px;min-width:70px;text-align:center;border:2px solid}
.held{color:#7FD4FF;border-color:#7FD4FF}
.up{color:#39FF14;border-color:#39FF14}
.down{color:#FF2A2A;border-color:#FF2A2A}
.foot{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#8A8068;font-size:13px}
</style></head><body>
<div class="wrap">
<h1>SELECTION SHOW</h1>
<div class="sub">PROJECTED AP TOP 20 · WEEK 5 · SAT 10:18 PM MDT</div>
<div class="grid" id="g"></div>
<div class="foot">FLORIDA 21 to 8 after 52-28 over No. 4 · OLE MISS 4 to 15 · official poll Sunday noon MDT</div>
</div>
<script>
const T=[[1,"TEXAS","4-0","-","held","251","#FF6A00","W 20-17 @ TENN"],[2,"GEORGIA","4-0","-","held","61","#BA0C2F","W 41-13 vs OU"],[3,"NOTRE DAME","4-0","-","held","87","#C9A227","W 49-10 @ PUR"],[4,"INDIANA","4-0","-","held","84","#EE1C2E","W 29-23 vs NW"],[5,"MIAMI","4-0","-","held","2390","#F47321","W 52-3 vs CMU"],[6,"ALABAMA","4-0","+2","up","333","#9E1B32","W 49-18 vs SC"],[7,"OHIO STATE","3-1","-","held","194","#BB0000","W 42-19 vs ILL"],[8,"FLORIDA","4-0","+13","up","57","#FA4616","W 52-28 vs #4 OM"],[9,"LSU","3-1","+1","up","99","#6B2FA0","W 35-6 vs A and M"],[10,"BYU","3-0","-1","down","252","#3B82F6","BYE"],[11,"TEXAS TECH","4-0","-","held","2641","#E62B2B","W 49-14 vs SHSU"],[12,"UTAH","4-0","+3","up","254","#CC0000","W 31-17 @ ISU"],[13,"OREGON","3-1","+7","up","2483","#FEE123","W 41-27 @ #12 USC"],[14,"IOWA","4-0","+3","up","2294","#FFCD00","W 20-19 @ #18 MICH"],[15,"OLE MISS","3-1","-11","down","145","#CE1126","L 52-28 @ FLA"],[16,"TENNESSEE","3-1","-2","down","2633","#FF8200","L 20-17 vs #1 TEX"],[17,"USC","4-1","-5","down","30","#FFC72C","L 41-27 vs ORE"],[18,"MISS STATE","4-0","+6","up","344","#761F2A","W 31-24 vs #19 MIZ"],[19,"MICHIGAN","3-1","-1","down","130","#FFCB05","L 20-19 vs IOWA"],[20,"MISSOURI","3-1","-1","down","142","#F1B82D","L 31-24 @ MSST"]];
const g=document.getElementById("g");
T.forEach(t=>{const [r,n,rec,mv,cls,id,col,res]=t;g.insertAdjacentHTML("beforeend",`<div class=\"card\" style=\"box-shadow:inset 0 0 0 2px ${col}55\"><img class=\"logo\" src=\"https://a.espncdn.com/i/teamlogos/ncaa/500/${id}.png\" alt=\"${n}\"><div class=\"rank\" style=\"color:${col}\">${r}</div><div class=\"meta\"><div class=\"name\">${n}</div><div class=\"line\">${rec} · ${res}</div></div><div class=\"chip ${cls}\">${mv}</div></div>`);});
</script></body></html>
